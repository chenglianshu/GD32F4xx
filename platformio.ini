; PlatformIO Project Configuration File
; grblHAL GD32F425RET6 port for LKS_ED1_CNC_V1.1/V2.0 board.

[platformio]
src_dir = Src
include_dir = Inc

[env]
; GD32 PlatformIO support is community maintained by CommunityGD32Cores.
; If the platform is already installed locally,
; the short form below is sufficient. For a fresh machine, use the HTTPS URL:
; platform = https://github.com/CommunityGD32Cores/platform-gd32.git
; platform_packages = framework-spl-gd32@https://github.com/CommunityGD32Cores/gd32-pio-spl-package.git
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
platform_packages =
    framework-spl-gd32@https://github.com/CommunityGD32Cores/gd32-pio-spl-package.git
    toolchain-gccarmnoneeabi@~1.140201.0
framework = spl
monitor_speed = 115200
monitor_echo = yes
lib_archive = no
lib_ldf_mode = off

[env:grblhal_gd32f425re]
board = genericGD32F425RE
board_build.ldscript = ldscripts/gd32f425re_flash.ld
board_build.spl_build_startup_file = no

build_flags =
    -O2
    -Wno-attributes
    -I .
    -I Inc
    -I boards
    -I grbl
    -I FatFs
    -I sdcard
    -I laser
    -I spindle
    -I eeprom
    -D OVERRIDE_MY_MACHINE
    -D GD32F425
    -D GD32F4
    -D GD32F4xx
    -D STM32F407xx
    -D HXTAL_VALUE=8000000U
    -I GD32F4xx_usb_library/device/core/Include
    -I GD32F4xx_usb_library/device/class/cdc/Include
    -I GD32F4xx_usb_library/driver/Include
    -I GD32F4xx_usb_library/ustd/class/cdc
    -I GD32F4xx_usb_library/ustd/common
    -D USE_STDPERIPH_DRIVER
    -mfloat-abi=softfp
    -mfpu=fpv4-sp-d16
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float

lib_deps =
    grbl
    FatFs
    sdcard

lib_extra_dirs =
    .
    boards
    FatFs
    sdcard

; Include the startup assembly from Startup/ as well as Src/
build_src_filter = +<*> -<system_gd32f4xx.c> +<../Startup/*> +<../laser/*> +<../spindle/*> +<../spindle/vfd/*> +<../eeprom/*> +<../encoder/*> +<../GD32F4xx_usb_library/device/core/Source/usbd_core.c> +<../GD32F4xx_usb_library/device/core/Source/usbd_enum.c> +<../GD32F4xx_usb_library/device/core/Source/usbd_transc.c> +<../GD32F4xx_usb_library/device/class/cdc/Source/cdc_acm_core.c> +<../GD32F4xx_usb_library/driver/Source/drv_usb_core.c> +<../GD32F4xx_usb_library/driver/Source/drv_usb_dev.c> +<../GD32F4xx_usb_library/driver/Source/drv_usbd_int.c>

extra_scripts = pre:extra_script.py

upload_protocol = jlink
debug_tool = jlink
debug_speed = 4000
